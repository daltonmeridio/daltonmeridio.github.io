</p></div><div style="display:contents" dir="ltr"><figure class="block-color-gray_background callout" style="white-space:pre-wrap;display:flex" id="34d3a394-83f9-80a7-810c-d5a68cccc7ef"><div style="font-size:1.5em"><span class="icon">💡</span></div><div style="width:100%"><div style="display:contents" dir="auto"><h3 id="34d3a394-83f9-80e1-9f79-ccb07eaa13fc" class=""><strong>HTTP request smuggling, confirming a CL.TE vulnerability via differential responses</strong></h3></div><div style="display:contents" dir="auto"><blockquote id="34d3a394-83f9-8058-8e97-c9000b008243" class=""><div style="display:contents" dir="auto"><p id="34d3a394-83f9-8043-b892-f59eed770345" class="">El contrabando de solicitudes HTTP es una técnica para interferir en la forma en que un sitio web procesa secuencias de solicitudes HTTP recibidas de uno o más usuarios. Las vulnerabilidades de contrabando de solicitudes suelen ser críticas, ya que permiten a un atacante eludir los controles de seguridad, obtener acceso no autorizado a datos confidenciales y comprometer directamente a otros usuarios de la aplicación.</p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-8079-a2bd-d25d6ac8d10c" class="">El contrabando de solicitudes se asocia principalmente con las solicitudes HTTP/1. Sin embargo, los sitios web que admiten HTTP/2 pueden ser vulnerables, dependiendo de su arquitectura de back-end.</p></div></blockquote></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-803b-9391-db9e9c5a1bc4" class="">Imaginemos que el front-end prioriza el primer encabezado content-length y el back-end prioriza el segundo. Desde la perspectiva del back-end, el flujo TCP podría verse así:</p></div><div style="display:contents" dir="auto"><script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js" integrity="sha512-7Z9J3l1+EYfeaPKcGXu3MS/7T+w19WtKQY/n+xzmw4hZhJ9tyYmcUS+4QqAlzhicE5LAfMQSF3iFTK9bQdTxXg==" crossorigin="anonymous" referrerPolicy="no-referrer"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" integrity="sha512-tN7Ec6zAFaVSG3TpNAKtk4DOHNpSwKHxxrsiw4GHKESGPs5njn/0sMCUMl2svV4wo4BK/rCP7juYz+zx+l6oeQ==" crossorigin="anonymous" referrerPolicy="no-referrer"/><script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js" integrity="sha512-whYhDwtTmlC/NpZlCr6PSsAaLOrfjVg/iXAnC4H/dtiHawpShhT2SlIMbpIhT/IL/NrpdMm+Hq2C13+VKpHTYw==" crossorigin="anonymous" referrerPolicy="no-referrer"></script><pre id="34d3a394-83f9-80fc-aeda-eb9db6f8c000" class="code code-wrap"><code class="language-bash" style="white-space:pre-wrap;word-break:break-all">POST / HTTP/1.1
Host: example.com
Content-Length: 6
Content-Length: 5

12345GPOST / HTTP/1.1
Host: example.com</code></pre></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-80e4-8066-d568528ac022" class="">Internamente, el front-end reenvía las primeras cabeceras y las segundas al back-end, que solo lee el contenido del segundo encabezado antes de responder. Esto provoca que el socket del back-end se sature con los datos naranjas. Cuando llega la solicitud verde legítima, esta se añade al contenido naranja, generando una respuesta inesperada.</p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-8003-b5ba-fa1663d9fe17" class="">En este ejemplo, la &#x27;G&#x27; inyectada corromperá la solicitud del usuario verde y probablemente recibirá una respuesta del tipo &quot;Método desconocido GPOST&quot;.</p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-80b5-b07a-efce803897cd" class="">
</p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-8008-b8ac-de8ad965a6e3" class="">Dado que la especificación permite implícitamente procesar solicitudes utilizando tanto Transfer-Encoding: chunked como Content-Length , pocos servidores rechazan dichas solicitudes. Si encontramos una manera de ocultar el encabezado Transfer-Encoding a un servidor en una cadena, este recurrirá a Content-Length y podremos desincronizar todo el sistema.</p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-80bf-8373-e545694c5160" class="">Es posible que no estés muy familiarizado con la codificación por fragmentos, ya que herramientas como Burp Suite almacenan automáticamente en búfer las solicitudes/respuestas por fragmentos en mensajes regulares para facilitar la edición. En un mensaje por fragmentos, el cuerpo consta de cero o más fragmentos. Cada fragmento consta del tamaño del fragmento, seguido de un salto de línea (\r\n) y, a continuación, del contenido del fragmento. El mensaje finaliza con un fragmento de tamaño cero. Aquí tienes un ejemplo sencillo de ataque de desincronización mediante codificación por fragmentos:</p></div><div style="display:contents" dir="auto"><pre id="34d3a394-83f9-8055-b308-ffd0307be31f" class="code code-wrap"><code class="language-bash" style="white-space:pre-wrap;word-break:break-all">POST / HTTP/1.1
Host: example.com
Content-Length: 6
Transfer-Encoding: chunked

0

GPOST / HTTP/1.1
Host: example.com</code></pre></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-808d-a3dc-f4f3523a57d5" class="">Esta técnica funciona en bastantes sistemas, pero podemos explotar muchos más haciendo que el encabezado Transfer-Encoding sea un poco más difícil de detectar, de modo que un sistema no lo vea. Esto se puede lograr utilizando discrepancias en el análisis HTTP de los servidores.</p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-806d-b296-dadd47d0ff08" class=""><strong>Detectar</strong></p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-80c8-b75d-f2d19bea5cd1" class="">El método obvio para detectar vulnerabilidades de manipulación de solicitudes, esto consiste en enviar una solicitud ambigua seguida de una solicitud &quot;víctima&quot; normal, y observar si esta última recibe una respuesta inesperada. Sin embargo, este método es extremadamente susceptible a interferencias; si la solicitud de otro usuario llega al socket infectado antes que la nuestra, recibirá la respuesta corrupta y no detectaremos la vulnerabilidad. Esto significa que, en un sitio web activo con un alto volumen de tráfico, puede ser difícil demostrar la existencia de manipulación de solicitudes sin explotar a numerosos usuarios legítimos en el proceso. Incluso en un sitio sin otro tráfico, existe el riesgo de falsos negativos causados por peculiaridades a nivel de aplicación que interrumpen las conexiones.</p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-808a-b765-fe7686529c69" class=""><strong>1. El Desfase de Longitud (CL vs. TE)</strong></p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-8004-9e2f-d0df85b60d34" class="">En un escenario <strong>CL.TE</strong>:</p></div><div style="display:contents" dir="auto"><ul id="34d3a394-83f9-80d7-8265-c870f718c77f" class="bulleted-list"><li style="list-style-type:disc"><strong>Front-end (CL):</strong> Mira el encabezado <code>Content-Length</code>. Si dices que hay 100 bytes, él lee 100 bytes y los pasa todos al Back-end.</li></ul></div><div style="display:contents" dir="auto"><ul id="34d3a394-83f9-80b7-a833-fee7c9d29cc2" class="bulleted-list"><li style="list-style-type:disc"><strong>Back-end (TE):</strong> Ignora el <code>Content-Length</code> y mira el <code>Transfer-Encoding: chunked</code>. Él empieza a leer trozos (chunks). Cuando encuentra un <code><strong>0</strong></code><strong> seguido de una línea vacía</strong>, piensa: &quot;Ah, aquí terminó la petición&quot;.</li></ul></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-8075-8218-d0dfcd33ed43" class=""><strong>2. El &quot;Contrabando&quot; (Smuggling)</strong></p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-8013-a594-ecbcc31d3924" class="">Lo que sucede no es exactamente que la petición espere a que la reenvíes para &quot;completarse&quot;, sino que <strong>tú engañas al Back-end</strong> para que crea que la petición terminó antes de lo que el Front-end cree.</p></div><div style="display:contents" dir="auto"><ul id="34d3a394-83f9-803a-af0b-dff9e0e12f3c" class="bulleted-list"><li style="list-style-type:disc">Envías una petición con un cuerpo que contiene un &quot;chunk&quot; de tamaño <code>0</code>.</li></ul></div><div style="display:contents" dir="auto"><ul id="34d3a394-83f9-80fc-a295-ddb9a23de77d" class="bulleted-list"><li style="list-style-type:disc">El <strong>Back-end</strong> lee hasta ese <code>0</code> y procesa esa petición.</li></ul></div><div style="display:contents" dir="auto"><ul id="34d3a394-83f9-80d7-b71a-e48a35641eba" class="bulleted-list"><li style="list-style-type:disc"><strong>El &quot;Resto&quot;:</strong> Todo lo que escribiste después de ese <code>0</code> se queda en el <strong>buffer de la conexión</strong> del servidor Back-end.</li></ul></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-80f4-bdb4-e125b215411b" class=""><strong>3. La Respuesta Diferencial (Confirmación)</strong></p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-80a2-bdf0-dae9e4d6fd09" class="">Aquí es donde entra lo que mencionas de &quot;acceder a recursos no permitidos&quot; o ver respuestas distintas:</p></div><div style="display:contents" dir="auto"><ol type="1" id="34d3a394-83f9-80dc-937b-d8ac71d64c7d" class="numbered-list" start="1"><li><strong>Petición 1 (Ataque):</strong> Dejas &quot;colgando&quot; en el buffer un pedazo de texto que parece el inicio de otra petición (por ejemplo: <code>GET /admin HTTP/1.1...</code>).</li></ol></div><div style="display:contents" dir="auto"><ol type="1" id="34d3a394-83f9-8017-8f8b-cbbe37b33032" class="numbered-list" start="2"><li><strong>Petición 2 (Víctima o Confirmación):</strong> Cuando envías (o alguien más envía) la siguiente petición normal, el Back-end la recibe, pero <strong>la pega justo después</strong> de lo que dejaste colgando.</li></ol></div><div style="display:contents" dir="auto"><ol type="1" id="34d3a394-83f9-800d-a6f5-ed394c166763" class="numbered-list" start="3"><li><strong>El Resultado:</strong> El Back-end interpreta una petición deformada: <code>GET /admin ... GET /index ...</code>. Como la primera parte es la tuya, el servidor intenta responder a <code>/admin</code>.</li></ol></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-805c-b6b4-f201f289234d" class="">Técnicamente esto lo podemos aplicar al lab</p></div><div style="display:contents" dir="ltr"><figure id="34f3a394-83f9-80f5-9a02-fc8ccef22227" class="image"><a href="HTTP%20Request%20Smuggling/image.png"><img style="width:604.96875px" src="HTTP%20Request%20Smuggling/image.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="34f3a394-83f9-804f-aecf-c5f8005b4f67" class="">Aquí voy a clarar que debemos manejar bien el Content-Length pue el tamaño sera desde cero hasta el final de la segunda petición sin contar el retorno de carro y el salto de linea es decir solo hasta <code><strong>Test: A </strong></code></p></div><div style="display:contents" dir="ltr"><figure id="34f3a394-83f9-80fc-a479-eeca1a2384f4" class="image"><a href="HTTP%20Request%20Smuggling/image%201.png"><img style="width:320.984375px" src="HTTP%20Request%20Smuggling/image%201.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-8006-a6e3-c6655659ee45" class="">Y se resuelve el lab:</p></div><div style="display:contents" dir="ltr"><figure id="34d3a394-83f9-806b-8f74-f2d57a5ee8e3" class="image"><a href="HTTP%20Request%20Smuggling/image%202.png"><img style="width:638.6146240234375px" src="HTTP%20Request%20Smuggling/image%202.png"/></a></figure></div></div></figure></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-8043-bccc-d02f441df116" class="">
</p></div><div style="display:contents" dir="ltr"><figure class="block-color-gray_background callout" style="white-space:pre-wrap;display:flex" id="34d3a394-83f9-8079-955c-cefbcc5ad372"><div style="font-size:1.5em"><span class="icon">💡</span></div><div style="width:100%"><div style="display:contents" dir="auto"><h3 id="34d3a394-83f9-80b9-b015-d78a0a325edd" class=""><strong>HTTP request smuggling, confirming a TE.CL vulnerability via differential responses</strong></h3></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-80d3-9504-f4af1ab64a7b" class="">Este ejemplo es lo contrario a la vuln pasda pues ahora es el front-end el que interpreta TE y el back-end CL, por lo cual la cosa cambia, al ser el front-end el que interpreta TE esta va en formato chunked, y presisamente el 0 es el final del chunked, por lo que la nueva solicitud debe ir antes de ese 0 que asi se interpreta todo.</p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-80ee-a07d-c2d8df0fd28a" class="">
</p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-8092-9434-f5473af2bc03" class="">Aquí podemos ver como creamos una solicitud en donde en la primera parte va en formato chunked con un Content-Length de solo cuatro esto se debe a que estos cuatro seran parte de la primer solicitud, pero esos bytes tienen el tamaño de la segunda:</p></div><div style="display:contents" dir="auto"><pre id="34d3a394-83f9-80bf-966a-c429866cc185" class="code code-wrap"><code class="language-bash" style="white-space:pre-wrap;word-break:break-all">Content-Length: size

size
POST / HTTP/1.1</code></pre></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-808d-bb27-fbf586111664" class="">En lo general el segundo size debe estar en formato hexadecimal, ese size abarca desde el formato de la petición (desde POST) hasta antes de o:</p></div><div style="display:contents" dir="ltr"><figure id="34f3a394-83f9-8000-9a2f-c670db59e878" class="image"><a href="HTTP%20Request%20Smuggling/image%203.png"><img style="width:333.984375px" src="HTTP%20Request%20Smuggling/image%203.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="34f3a394-83f9-8031-8679-f33a039361b3" class="">
</p></div><div style="display:contents" dir="ltr"><figure id="34f3a394-83f9-80bb-bea2-c94a7e557239" class="image"><a href="HTTP%20Request%20Smuggling/image%204.png"><img style="width:631.984375px" src="HTTP%20Request%20Smuggling/image%204.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-80e4-bd0f-e8b62834d88d" class="">Para la segunda petición tenemos que formarla bien, por lo cual tenemos que generar bien la petición con las cabeceras debidas, aquí también tiene el Content-Length en este aspecto lo tiene por que tenemos que formar bien la petición por lo que tambien pondremos algo en el cuerpo de esta, algo sencillo bastara y tenemos que poner su tamaño:</p></div><div style="display:contents" dir="ltr"><figure id="34f3a394-83f9-80ab-b306-c55ffdf7dd8c" class="image"><a href="HTTP%20Request%20Smuggling/image%205.png"><img style="width:325.984375px" src="HTTP%20Request%20Smuggling/image%205.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-80ee-b2f4-ca2c886c6032" class="">Pero ya se que estas pensando que la cabecera tiene 20 y en la que esta acá arriba tiene 6 bytes, pues es aquí en donde precisamente tenemos que “inflar” esa cabecera para que los datos queden “colgando” y se produce el error que buscamos, el 404, de esta manera podemos resolver el lab: </p></div><div style="display:contents" dir="ltr"><figure id="34d3a394-83f9-809c-b5db-d05a8d6f4449" class="image"><a href="HTTP%20Request%20Smuggling/image%206.png"><img style="width:638.6458740234375px" src="HTTP%20Request%20Smuggling/image%206.png"/></a></figure></div><div style="display:contents" dir="auto"><blockquote id="3583a394-83f9-8003-a756-db7db7cce9f7" class="">Nota<br/>Una desincronización puede pasar cuando no se envian los datos esperados, en este caso por ejemplo como el Back-end lee Content-Length podemos enviar mas datos de los que lee, por ejemplo: <br/><br/>Transfer-Encoding: chunked<br/>Content-Length: 13<br/><br/>3\r\n<br/>abc\r\n<br/>0\r\n<br/>\r\n<br/><br/>desde el 3 hasta un renglon despues del 0 son 13 bytes, y es aquí en donde la desincronización se puede dar, ya que podemos darle a Content-Length mas bytes de los que son, así el backend quedara esperando los bytes que faltan, y esto a su vez creara un request time o algo asi, pues nunca llegaran esos datos, ejemplo:<br/><br/>Transfer-Encoding: chunked<br/>Content-Length: 18    → aquí el back-end esperara los datos faltantes provocando<br/>                                       la desincronización <br/>3\r\n<br/>abc\r\n<br/>0\r\n<br/>\r\n</blockquote></div></div></figure></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-80df-8837-df668f6cc441" class="">
</p></div><div style="display:contents" dir="ltr"><figure class="block-color-gray_background callout" style="white-space:pre-wrap;display:flex" id="34d3a394-83f9-806b-a9b9-fef17d50e8f9"><div style="font-size:1.5em"><span class="icon">💡</span></div><div style="width:100%"><div style="display:contents" dir="auto"><h3 id="34d3a394-83f9-80e4-959c-fd59e0eca3b9" class=""><strong>Exploiting HTTP request smuggling to bypass front-end security controls, CL.TE vulnerability</strong></h3></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-8082-b53c-e8280a717ac5" class="">Este laboratorio es similar al primer laboratorio de HTB, pues tenemos que aprovechar de CL.TE para generar que el administrador genere una acción.</p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-805b-b6d0-d0e74b247d61" class="">Si intentamos accesar al panel de administrador vemos que esta bloqueada, esto a ni vel “waf”.</p></div><div style="display:contents" dir="ltr"><figure id="34d3a394-83f9-8013-81c1-d76df9f6fafa" class="image"><a href="HTTP%20Request%20Smuggling/image%207.png"><img style="width:638px" src="HTTP%20Request%20Smuggling/image%207.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-8057-97ac-c3c05926ef8c" class="">
</p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-809e-a63b-fba617e7dc56" class="">Como ya vimos esta vulnerabilidad me ire de lleno con la vuln, aquí podemos ver que generamos el ataque, en esta parte vemos que tenemos un mensaje en donde nos dice que esta sección admin solo es para localhost:</p></div><div style="display:contents" dir="ltr"><figure id="34d3a394-83f9-801d-9320-e745e7c76bdb" class="image"><a href="HTTP%20Request%20Smuggling/image%208.png"><img style="width:637.953125px" src="HTTP%20Request%20Smuggling/image%208.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-801e-9eae-d54422710f20" class="">
</p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-800d-ae84-e9151bdb399e" class="">Entonces para generar correctamente la petición agregamos la cabecera host, pero tambien nos encontramos con la limitante de que la cabecera esta duplicada:</p></div><div style="display:contents" dir="ltr"><figure id="34d3a394-83f9-80bf-b80f-e4dfdd82e585" class="image"><a href="HTTP%20Request%20Smuggling/image%209.png"><img style="width:638px" src="HTTP%20Request%20Smuggling/image%209.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-8007-aa22-efb16645f061" class="">
</p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-8031-ab8e-e8185bf1a7b9" class="">En este caso podemos agregar un cuerpo a la petición, ya como lo hemos echo:</p></div><div style="display:contents" dir="ltr"><figure id="34d3a394-83f9-8009-b92e-f5a63505f799" class="image"><a href="HTTP%20Request%20Smuggling/image%2010.png"><img style="width:638px" src="HTTP%20Request%20Smuggling/image%2010.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-80f8-b52d-ccb0ff103c77" class="">
</p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-800d-a4db-f9a204d10071" class="">Esto tambien con su Content-Length, aquí hay que hacer lo que vimos en el lab pasado “inflar” el Content-Length, aqui vemos que tiene 9 bytes de contenido:</p></div><div style="display:contents" dir="ltr"><figure id="34d3a394-83f9-8057-a28b-e3611992b5db" class="image"><a href="HTTP%20Request%20Smuggling/image%2011.png"><img style="width:586.984375px" src="HTTP%20Request%20Smuggling/image%2011.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-80d0-9978-e23bec387989" class="">
</p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-802a-89d2-d9fd91c92ab0" class="">Pero aquí para acceder al panel de admin tenemos que agregar mas bytes:</p></div><div style="display:contents" dir="ltr"><figure id="34d3a394-83f9-8037-a30c-e14155f8022b" class="image"><a href="HTTP%20Request%20Smuggling/image%2012.png"><img style="width:637.953125px" src="HTTP%20Request%20Smuggling/image%2012.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-80b7-ac26-f4d7042a65df" class="">
</p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-8075-bf09-f45461fded84" class="">Esto nos da acceso a la funcionalidad, y podemos agegarla a la petición</p></div><div style="display:contents" dir="ltr"><figure id="34d3a394-83f9-801e-b40e-ca036389c871" class="image"><a href="HTTP%20Request%20Smuggling/image%2013.png"><img style="width:423.984375px" src="HTTP%20Request%20Smuggling/image%2013.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-8026-b11c-c4f56b088c2b" class="">

</p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-80fd-86f7-eef747ca2210" class="">Con este tamaño podemos tener la petición del admin, aquí ocupamos la cookie de la session:</p></div><div style="display:contents" dir="ltr"><figure id="34d3a394-83f9-8047-bcc5-e43681b3ebd1" class="image"><a href="HTTP%20Request%20Smuggling/image%2035.png"><img style="width:637.984375px" src="HTTP%20Request%20Smuggling/image%2035.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-8054-a4e2-e6bf19f273f5" class="">

</p></div><div style="display:contents" dir="ltr"><figure id="34d3a394-83f9-80fa-b56d-eecee53a5054" class="image"><a href="HTTP%20Request%20Smuggling/image%2037.png"><img style="width:638px" src="HTTP%20Request%20Smuggling/image%2037.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-80c8-8655-dedf6ad193a2" class="">
</p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-804a-a76d-d81d10b3d403" class="">
</p></div><div style="display:contents" dir="ltr"><figure id="34d3a394-83f9-805e-9893-cb3e50179aed" class="image"><a href="HTTP%20Request%20Smuggling/image%2038.png"><img style="width:483px" src="HTTP%20Request%20Smuggling/image%2038.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-809d-86dc-d46b8657925b" class="">
</p></div><div style="display:contents" dir="ltr"><figure id="34d3a394-83f9-808c-8137-f35f818f3b91" class="image"><a href="HTTP%20Request%20Smuggling/image%2039.png"><img style="width:637.796875px" src="HTTP%20Request%20Smuggling/image%2039.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-80f7-a35c-e3e20d72c2a0" class="">
</p></div><div style="display:contents" dir="ltr"><figure id="34d3a394-83f9-803e-9cde-e50d0a832c23" class="image"><a href="HTTP%20Request%20Smuggling/image%2040.png"><img style="width:638px" src="HTTP%20Request%20Smuggling/image%2040.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-809c-b0d8-c4f8ebd88b1e" class="">

</p></div><div style="display:contents" dir="ltr"><figure class="block-color-gray_background callout" style="white-space:pre-wrap;display:flex" id="34d3a394-83f9-80bd-be20-c2415ef12ea1"><div style="font-size:1.5em"><span class="icon">💡</span></div><div style="width:100%"><div style="display:contents" dir="auto"><h2 id="34d3a394-83f9-806a-9f6d-e57e95ca2623" class=""><strong>Response queue poisoning via H2.TE request smuggling</strong></h2></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-8006-9664-e3dd82d8caca" class="">Este laboratorio es un poco diferente a los demas, en si la vaina va de lo mismo,hay que entrar al admin, el admin va bloqueado, pero hay que hacer un smuggling, aqui hay una cosa a destacar el lab degrada el HTTP 2, es decir el Front-end maneja HTTP2 pero el Back-end HTTP/1.1, estudiemos un poco mas.</p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-80d3-bb31-c62ddc1521c0" class=""><strong>El smugging</strong></p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-80bb-9c63-d1498ec07f1c" class="">La vulnerabilidad ocurre porque el Front-end y el Back-end no se ponen de acuerdo sobre dónde termina una solicitud y empieza la siguiente.  </p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-8015-984f-f5859f0bce28" class=""> El Front-end H2 Be una sola solicitud y la pasa de manera integra al Back-end a través de una conexión TCP persistente (Varios usuarios la utilizan).             </p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-8096-bc16-ea26aad4425a" class=""> El Back-end HTTP/1.1 Lee la cabecera Transfer-Encoding: chunked que el atacante inyectó. Cree que la solicitud termina antes de lo que realmetne termina. Lo que  queda después del “chunk cero” queda “flotando” en el buffer de la conexión TCP del Back-end, este lo reinterpreta como el inicio de una nueva solicitud.         </p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-8060-893e-fe21b7002659" class="">
</p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-80e8-a331-cd63d1d9c473" class=""><strong>¿Cuando ocurre el envenenamiento de la cola de respuestas?</strong></p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-8037-b212-e2605396cde3" class="">A diferencia del contrabando normal en donde solo se inyecta la petición, en el Response Queue Poisoning buscamos desincronizar el orden de las respuestas </p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-802f-847d-db0405044aa8" class="">El proceso paso a paso:</p></div><div style="display:contents" dir="auto"><ul id="34d3a394-83f9-806b-aa91-ce2207b0433e" class="bulleted-list"><li style="list-style-type:disc"><strong>Paso A:</strong> El atacante envía una solicitud maliciosa diseñada para que el Back-end crea que hay <strong>dos</strong> solicitudes, pero el Front-end solo vio <strong>una</strong>.</li></ul></div><div style="display:contents" dir="auto"><ul id="34d3a394-83f9-80a7-bf55-e37d8856b3ed" class="bulleted-list"><li style="list-style-type:disc"><strong>Paso B:</strong> El servidor procesa la &quot;primera&quot; (la legítima a ojos del Front-end) y genera una respuesta. Pero inmediatamente después, procesa la &quot;segunda&quot; (la de contrabando) y genera otra respuesta.</li></ul></div><div style="display:contents" dir="auto"><ul id="34d3a394-83f9-805c-a048-c2d8819b51d8" class="bulleted-list"><li style="list-style-type:disc"><strong>El Desfase:</strong> El Front-end está esperando <strong>una sola respuesta</strong> para el atacante. Recibe la primera y se la entrega. La <strong>segunda respuesta</strong> se queda en la cola de la conexión TCP, esperando ser enviada al siguiente cliente que pida algo.</li></ul></div><div style="display:contents" dir="auto"><blockquote id="34d3a394-83f9-8071-ad0e-f008d109edd5" class=""><strong>Resultado:</strong> Cuando una víctima inocente envía una solicitud, el Front-end toma la respuesta que ya estaba &quot;haciendo cola&quot; (la del atacante) y se la entrega a la víctima.</blockquote></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-809a-a68c-cb483accd99a" class="">
</p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-80bd-a8c0-fc09163f22d0" class="">Teniendo esto en cuenta vamos a generar el siguiente payload.</p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-8038-9e2c-c91929038203" class="">Esto tendría que interceptar la petición del administrador, y al administrador le tendría que salir la raiz de la pagina,</p></div><div style="display:contents" dir="ltr"><figure id="34d3a394-83f9-808d-93e5-df88e73592a9" class="image"><a href="HTTP%20Request%20Smuggling/image%2042.png"><img style="width:599.96875px" src="HTTP%20Request%20Smuggling/image%2042.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-80e7-a1f8-f06ba6f8ac04" class="">
</p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-80d4-bf29-c38765461893" class="">El admin se logea cada  15 segundos por lo que tenemos que intentar sincronizarnos con el para cachar su petición y que el tenga la nuestra, cuando esto pase, veremos la redirección con su cookie de sesión:</p></div><div style="display:contents" dir="ltr"><figure id="34d3a394-83f9-8071-8858-ecc1a0e81301" class="image"><a href="HTTP%20Request%20Smuggling/image%2043.png"><img style="width:637.921875px" src="HTTP%20Request%20Smuggling/image%2043.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-80a2-b549-c1f584ccc5bd" class="">
</p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-80f7-814a-fc0106870f50" class="">Cuando esto pase podremos tomarla y usarla para estar en el panel de administración:</p></div><div style="display:contents" dir="ltr"><figure id="34d3a394-83f9-8066-a326-eb97f799f576" class="image"><a href="HTTP%20Request%20Smuggling/image%2044.png"><img style="width:616.953125px" src="HTTP%20Request%20Smuggling/image%2044.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-806a-b2dc-db0918788053" class="">
</p></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-80eb-998f-f6bff9ee8754" class="">Y se resuelve el laboratorio:</p></div><div style="display:contents" dir="ltr"><figure id="34d3a394-83f9-8011-b0ea-ce7e94a12e95" class="image"><a href="HTTP%20Request%20Smuggling/image%2045.png"><img style="width:637.890625px" src="HTTP%20Request%20Smuggling/image%2045.png"/></a></figure></div></div></figure></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-8088-b6b4-ceb4f491fda3" class="">
</p></div><div style="display:contents" dir="ltr"><figure class="block-color-gray_background callout" style="white-space:pre-wrap;display:flex" id="34d3a394-83f9-80f3-97e4-d0529fa37995"><div style="font-size:1.5em"><span class="icon">💡</span></div><div style="width:100%"><div style="display:contents" dir="auto"><h2 id="34d3a394-83f9-80f9-bf16-f72583b4b2e2" class=""><strong>H2.CL request smuggling</strong></h2></div><div style="display:contents" dir="auto"><p id="3503a394-83f9-8044-b22a-e6351c63c0d1" class="">a</p></div></div></figure></div><div style="display:contents" dir="auto"><p id="34d3a394-83f9-80a6-a0fc-df8422ca7e1d" class="">
</p></div><div style="display:contents" dir="ltr"><figure class="block-color-gray_background callout" style="white-space:pre-wrap;display:flex" id="3503a394-83f9-80fb-ada6-d4dbcde2e658"><div style="font-size:1.5em"><span class="icon">💡</span></div><div style="width:100%"><div style="display:contents" dir="auto"><h2 id="3503a394-83f9-8089-8f6b-f0313639088d" class=""><strong>HTTP/2 request smuggling via CRLF injection</strong></h2></div><div style="display:contents" dir="auto"><p id="3503a394-83f9-809a-b285-d667a536f3b9" class="">
</p></div><div style="display:contents" dir="auto"><p id="3503a394-83f9-802a-a67e-c3ddba97ee9d" class="">En este laboratorio vamos a hacer una degradación de HTTP/2 a HTTP/1.1 y a obtener los datos de otro usuario, pero aquí hay una diferencia con los otros  laboratorios, pues este laboratorio cuenta con algunas protecciones en las cabeceras para poder mitigar ciertos ataques, esta protección es la sanitización de las cabeceras, es decir que algunas no serán aceptadas. </p></div><div style="display:contents" dir="auto"><p id="3503a394-83f9-805c-a487-f78d5d0929ac" class="">Por ejemplo en este intento se incluye la cabecera <code><strong>Transfer-Encoding</strong></code> para delimitar el “chunked” sin embargo al momento de querer generar un error la segunda solicitud no va a pasar, por lo mismo de que la cabecera no es incluida:</p></div><div style="display:contents" dir="ltr"><figure id="3503a394-83f9-8077-a721-f8a1fa80199c" class="image"><a href="HTTP%20Request%20Smuggling/image%2046.png"><img style="width:585.953125px" src="HTTP%20Request%20Smuggling/image%2046.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="3503a394-83f9-809a-8e20-e16759ebe9b0" class="">Para poder sortear esto podemos agregar la cabecera de manera “oculta” con la opción <code><strong>Request headers</strong></code> de Burp, en el panel lateral izquierdo (o derecho si le moviste) :</p></div><div style="display:contents" dir="ltr"><figure id="3503a394-83f9-80e8-a1db-dcd41927cd93" class="image"><a href="HTTP%20Request%20Smuggling/image%2047.png"><img style="width:527.984375px" src="HTTP%20Request%20Smuggling/image%2047.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="3503a394-83f9-8065-a99d-c26e1fb4e3d5" class="">Podemos agregar una cabecera en <code><strong>+</strong></code></p></div><div style="display:contents" dir="ltr"><figure id="3503a394-83f9-8000-8b8e-e14fa25ec690" class="image"><a href="HTTP%20Request%20Smuggling/image%2048.png"><img style="width:334.96875px" src="HTTP%20Request%20Smuggling/image%2048.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="3503a394-83f9-801a-9c0b-d6408e537aa5" class="">Es aquí en donde hace sentido el nombre del lab también, pues podemos agregar una cabecera, para agregarla tenemos que hacer <code><strong>shif+enter</strong></code> para poder hacer el salto entonces se colocara <code><strong>\r\n</strong></code> que son <strong><a href="https://www.google.com/search?q=Carriage+Return+%28CR%29&amp;sca_esv=b13991bd8b31e71e&amp;sxsrf=ANbL-n5l9VzYlKNQ7K7P1y5w5GPmwj_e3Q%3A1777415329778&amp;ei=oTTxaZyeL7rTp84P9N_s0A0&amp;biw=1906&amp;bih=935&amp;oq=CR+LF&amp;gs_lp=Egxnd3Mtd2l6LXNlcnAiBUNSIExGKgIIAzIGEAAYBxgeMgYQABgHGB4yBhAAGAcYHjIFEAAYgAQyBRAAGIAEMgUQABiABDIEEAAYHjIEEAAYHjIEEAAYHjIEEAAYHki1txhQgI4YWKGhGHADeAGQAQCYAVegAawBqgEBMrgBA8gBAPgBAvgBAZgCBaACnQLCAgoQABhHGNYEGLADwgINEAAYgAQYigUYQxiwA8ICDhAAGOQCGNYEGLAD2AEBwgIXEC4Y3AYYuAYY2gYY2AIYyAMYsAPYAQHCAggQABiABBjHA5gDAIgGAZAGE7oGBggBEAEYCZIHAzMuMqAHjQmyBwMwLjK4B9cBwgcFMy0yLjPIB2KACAE&amp;sclient=gws-wiz-serp&amp;ved=2ahUKEwjjkObKzZGUAxVfExAIHSqlPBMQgK4QegYIAQgAEAk">Carriage Return (CR)</a></strong><strong>  y </strong><strong><a href="https://www.google.com/search?q=Line+Feed+%28LF%29&amp;sca_esv=b13991bd8b31e71e&amp;sxsrf=ANbL-n5l9VzYlKNQ7K7P1y5w5GPmwj_e3Q%3A1777415329778&amp;ei=oTTxaZyeL7rTp84P9N_s0A0&amp;biw=1906&amp;bih=935&amp;oq=CR+LF&amp;gs_lp=Egxnd3Mtd2l6LXNlcnAiBUNSIExGKgIIAzIGEAAYBxgeMgYQABgHGB4yBhAAGAcYHjIFEAAYgAQyBRAAGIAEMgUQABiABDIEEAAYHjIEEAAYHjIEEAAYHjIEEAAYHki1txhQgI4YWKGhGHADeAGQAQCYAVegAawBqgEBMrgBA8gBAPgBAvgBAZgCBaACnQLCAgoQABhHGNYEGLADwgINEAAYgAQYigUYQxiwA8ICDhAAGOQCGNYEGLAD2AEBwgIXEC4Y3AYYuAYY2gYY2AIYyAMYsAPYAQHCAggQABiABBjHA5gDAIgGAZAGE7oGBggBEAEYCZIHAzMuMqAHjQmyBwMwLjK4B9cBwgcFMy0yLjPIB2KACAE&amp;sclient=gws-wiz-serp&amp;ved=2ahUKEwjjkObKzZGUAxVfExAIHSqlPBMQgK4QegYIAQgAEAs">Line Feed (LF)</a></strong><strong> </strong>lo cual agrega nuestro <code><strong>Transfer-Encoding</strong></code> de manera “embebida”.</p></div><div style="display:contents" dir="ltr"><figure id="3503a394-83f9-8001-8d46-e073cf741082" class="image"><a href="HTTP%20Request%20Smuggling/image%2049.png"><img style="width:322.984375px" src="HTTP%20Request%20Smuggling/image%2049.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="3503a394-83f9-801e-b8e0-e16457847881" class="">
</p></div><div style="display:contents" dir="ltr"><figure id="3503a394-83f9-80d0-bd0f-e29b8a5f8e2c" class="image"><a href="HTTP%20Request%20Smuggling/image%2050.png"><img style="width:637.921875px" src="HTTP%20Request%20Smuggling/image%2050.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="3503a394-83f9-801a-96a8-e9312fcbae79" class="">Nos va salir este mensaje pero es normal: </p></div><div style="display:contents" dir="ltr"><figure id="3503a394-83f9-801d-8a54-c5a202eae18c" class="image"><a href="HTTP%20Request%20Smuggling/image%2051.png"><img style="width:637.96875px" src="HTTP%20Request%20Smuggling/image%2051.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="3503a394-83f9-80ab-bce5-d4f558027406" class="">Ahora si podemos provocar el error que buscamos, ya que ahora si esta interpretando la cabecera: </p></div><div style="display:contents" dir="ltr"><figure id="3503a394-83f9-8023-b647-ec2cd9b43522" class="image"><a href="HTTP%20Request%20Smuggling/image%2052.png"><img style="width:637.96875px" src="HTTP%20Request%20Smuggling/image%2052.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="3503a394-83f9-806d-8219-c2d095b14bfc" class="">
</p></div><div style="display:contents" dir="auto"><p id="3503a394-83f9-8045-a9c5-e6d4b3f13e99" class="">Teniendo esto ya completado y preparado, ahora podemos robar los datos de algún usuario, para esto es necesario “arrastrar” nuestra cookie de sesión, y en este punto haremos uso del parámetro search, pues lo que haremos es como en los demas lab, “interceptar” la petición del usuario para poder tomar su información, por lo que aquí como en otro labs hay que inflar el <code><strong>Content-Length</strong></code> de la segunda petición</p></div><div style="display:contents" dir="ltr"><figure id="3503a394-83f9-8041-a6a3-c1d9b90ba464" class="image"><a href="HTTP%20Request%20Smuggling/image%2053.png"><img style="width:637.9375px" src="HTTP%20Request%20Smuggling/image%2053.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="3503a394-83f9-80a4-835a-cee30ab0a043" class="">Y en el reflejo de la lista de búsquedas podemos tomar la información del usuario: </p></div><div style="display:contents" dir="ltr"><figure id="3503a394-83f9-80f0-a704-d59c37c1133a" class="image"><a href="HTTP%20Request%20Smuggling/image%2054.png"><img style="width:637.984375px" src="HTTP%20Request%20Smuggling/image%2054.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="3503a394-83f9-8099-87a9-c8458b246216" class="">Vemos que no somos admin, pero somos otro usuario diferente:</p></div><div style="display:contents" dir="ltr"><figure id="3503a394-83f9-8081-a8ea-c5607d632058" class="image"><a href="HTTP%20Request%20Smuggling/image%2055.png"><img style="width:637.984375px" src="HTTP%20Request%20Smuggling/image%2055.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="3503a394-83f9-807f-be01-cfea64389299" class="">Laboratorio resuelto:</p></div><div style="display:contents" dir="ltr"><figure id="3503a394-83f9-800d-a0a4-ddba85ee08e3" class="image"><a href="HTTP%20Request%20Smuggling/image%2056.png"><img style="width:637.921875px" src="HTTP%20Request%20Smuggling/image%2056.png"/></a></figure></div></div></figure></div><div style="display:contents" dir="auto"><p id="3503a394-83f9-80e1-9691-d99a09d02d87" class="">
</p></div><div style="display:contents" dir="ltr"><figure class="block-color-gray_background callout" style="white-space:pre-wrap;display:flex" id="3503a394-83f9-80c0-bef5-e0c6fdb91a8e"><div style="font-size:1.5em"><span class="icon">💡</span></div><div style="width:100%"><div style="display:contents" dir="auto"><h2 id="3603a394-83f9-80b1-8b56-e601c20aed9c" class=""><strong>HTTP/2 request splitting via CRLF injection</strong></h2></div><div style="display:contents" dir="auto"><p id="3603a394-83f9-80a5-b435-db0f63fb97fe" class="">
</p></div><div style="display:contents" dir="auto"><p id="3603a394-83f9-8055-a378-d5ca797fb5e3" class="">Este laboratorio es similar al laboratorio pasado, tenemos que inyectar en las cabeceras, sin embargo ahora tenemos que inyectar mas que una cabecera misma sino que toda la petición la meteremos ahí, puesto que esto simulara un enter en el envío de los datos, lo haremos de la misma manera, en esta ocasión vamos a meter la ruta y el Host:</p></div><div style="display:contents" dir="ltr"><figure id="3603a394-83f9-805a-974e-fd8f37e241ba" class="image"><a href="HTTP%20Request%20Smuggling/image%2057.png"><img style="width:637.96875px" src="HTTP%20Request%20Smuggling/image%2057.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="3603a394-83f9-80a9-9989-f577f15aa908" class="">
</p></div><div style="display:contents" dir="auto"><p id="3603a394-83f9-8034-bd86-dc3f8b4531a5" class="">Como podemos ver que si logramos al inyección y logramos un error</p></div><div style="display:contents" dir="ltr"><figure id="3603a394-83f9-8044-a9ca-d9de640ee733" class="image"><a href="HTTP%20Request%20Smuggling/image%2058.png"><img style="width:637.953125px" src="HTTP%20Request%20Smuggling/image%2058.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="3603a394-83f9-80cc-84db-d71a811521af" class="">
</p></div><div style="display:contents" dir="ltr"><figure id="3603a394-83f9-80d1-9d31-f27101261d4e" class="image"><a href="HTTP%20Request%20Smuggling/image%2059.png"><img style="width:637.984375px" src="HTTP%20Request%20Smuggling/image%2059.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="3603a394-83f9-80a0-bdc7-ee89c3f712b0" class="">Realmente esto lo tenemos que hacer hasta lograr interceptar la petición del admistrador, y entonces el vera la nuestra como un intercambio. En muchos escenarios de request splitting/smuggling el otro usuario termina “viendo” o heredando tu petición inyectadda, pero no necesariamente de la forma intuitiva de “cargar la página y ver el request” lo que ocurre es que el request queda en la cola del backend y la siguiente petición de la otra persona puede:</p></div><div style="display:contents" dir="auto"><p id="3613a394-83f9-806f-90b4-fbddd29816f9" class="">Consumir tu respuesta</p></div><div style="display:contents" dir="auto"><p id="3613a394-83f9-80f3-abec-fb0ac298fe37" class="">Ejecutar tu request</p></div><div style="display:contents" dir="auto"><p id="3613a394-83f9-800e-88fe-d67502433730" class="">Quedar contaminada con tus bytes</p></div><div style="display:contents" dir="auto"><p id="3613a394-83f9-8052-87d5-e5366b55fd6d" class="">En esta ocación podemos ver que vemos la respuesta del admin con su cookie de sesión que esto es lo que ocupamos.</p></div><div style="display:contents" dir="ltr"><figure id="3603a394-83f9-80b6-bc5e-e34c1f42f0f9" class="image"><a href="HTTP%20Request%20Smuggling/image%2060.png"><img style="width:637.96875px" src="HTTP%20Request%20Smuggling/image%2060.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="3603a394-83f9-80f5-93d4-c7beb0f56e77" class="">
</p></div><div style="display:contents" dir="auto"><p id="3603a394-83f9-80ba-83f9-e609ba2a889f" class="">Ahora podemos hacer una petición con esa cookie y veremos que obtenemos un 200</p></div><div style="display:contents" dir="ltr"><figure id="3603a394-83f9-807c-abda-f916ac6eea19" class="image"><a href="HTTP%20Request%20Smuggling/image%2061.png"><img style="width:637.921875px" src="HTTP%20Request%20Smuggling/image%2061.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="3613a394-83f9-8059-9efa-dc4e09045f0b" class="">y procedemos a eliminar al usuario carlos</p></div><div style="display:contents" dir="ltr"><figure id="3603a394-83f9-80cd-8bf2-f863084baab2" class="image"><a href="HTTP%20Request%20Smuggling/image%2062.png"><img style="width:583.9375px" src="HTTP%20Request%20Smuggling/image%2062.png"/></a></figure></div><div style="display:contents" dir="auto"><p id="3603a394-83f9-80df-a7f4-e5b3e0adb2c1" class="">Tenemos el lab resuelto:</p></div><div style="display:contents" dir="ltr"><figure id="3603a394-83f9-806f-998a-cf937c9a008e" class="image"><a href="HTTP%20Request%20Smuggling/image%2063.png"><img style="width:637.921875px" src="HTTP%20Request%20Smuggling/image%2063.png"/></a></figure></div></div></figure></div><div style="display:contents" dir="auto"><p id="3603a394-83f9-8058-a56c-f2768902180a" class="">
